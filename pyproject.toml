[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vus-meta-predictor"
version = "0.1.0"
description = "Meta-learning pipeline for Variant of Uncertain Significance interpretation using genomic and protein language models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Raony"},
]
dependencies = [
    # Core
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "xgboost>=2.0",
    
    # Deep learning / Language models
    "torch>=2.1",
    "transformers>=4.36",
    
    # Bioinformatics
    "biopython>=1.82",
    "pysam>=0.22",
    "cyvcf2>=0.30",
    "pyBigWig>=0.3",
    "hgvs>=1.5",
    
    # Explainability
    "shap>=0.43",
    
    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    
    # Utilities
    "tqdm>=4.66",
    "requests>=2.31",
    "click>=8.1",
    "pydantic>=2.5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "jupyter>=1.0",
    "ipykernel>=6.27",
    "nbformat>=5.9",
]

gpu = [
    "flash-attn>=2.3",
]

[project.scripts]
vus-predict = "vus_meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
